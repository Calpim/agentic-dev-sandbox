[project]
name = "agentic-dev-sandbox"
version = "0.1.0"
description = "AI-Driven Autonomous Development Workflow sandbox"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "tasks",
    "specs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter or intentional)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = [
    "tasks/",
    "specs/",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
